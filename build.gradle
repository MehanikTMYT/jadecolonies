plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${name}-${minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    // NeoGradle 7.1.x / NeoForge 26.1.2 split the old 'data' run type into 'clientData' and
    // 'serverData'; only client-side data generation is used here, matching the previous
    // single 'data' run type's behavior (this mod has no datagen providers, so this run type
    // is unused at present but kept consistent with the rest of the 26.1.2 build.gradle style).
    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name 'LDTTeam - Modding'
        url 'https://ldtteam.jfrog.io/ldtteam/modding'
    }
    // Jade has no 26.1.2 build published to CurseMaven/CurseForge yet; the only currently
    // resolvable coordinate for Jade 26.1.8+neoforge (which targets MC 26.1/26.1.1/26.1.2) is
    // Modrinth's Maven-compatible repository. Verified reachable and resolvable at port time
    // (same coordinate already proven working by ../MineColonies-Jade-crops).
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // MineColonies is not published to mavenLocal by its own build, so it is consumed directly
    // from its build/libs output instead, matching the pattern already proven working in
    // ../warehouseWorkshop's build.gradle. jadecolonies lives at the same depth below
    // /root/home/forks (colonial-addons/jadecolonies), so ../../MineColonies resolves to
    // /root/home/forks/MineColonies exactly as it does for warehouseWorkshop.
    compileOnly files("$rootDir/../../MineColonies/build/libs/minecolonies-${minecolonies_version}.jar")
    localRuntime files("$rootDir/../../MineColonies/build/libs/minecolonies-${minecolonies_version}.jar")

    compileOnly "com.ldtteam:structurize:${structurize_version}"
    localRuntime "com.ldtteam:structurize:${structurize_version}"

    compileOnly "com.ldtteam:domum-ornamentum:${domumornamentum_version}"
    localRuntime "com.ldtteam:domum-ornamentum:${domumornamentum_version}"

    compileOnly "com.ldtteam:blockui:${blockui_version}"
    localRuntime "com.ldtteam:blockui:${blockui_version}"

    compileOnly "com.ldtteam:multipiston:${multipiston_version}"
    localRuntime "com.ldtteam:multipiston:${multipiston_version}"

    compileOnly 'com.intellij:annotations:+@jar'
}

project.tasks.named("processResources") {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            minecolonies_version: minecolonies_version,
            jade_version        : jade_version,
            domumornamentum_version: domumornamentum_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar.manifest.attributes([
    "Specification-Title"     : project.mod_id,
    "Specification-Vendor"    : project.mod_authors,
    "Specification-Version"   : "1",
    "Implementation-Title"    : project.name,
    "Implementation-Version"  : project.version,
    "Implementation-Vendor"   : project.mod_authors,
    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
])

java.withSourcesJar()

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
