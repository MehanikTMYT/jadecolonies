# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.114
neo_version_range=[26.1.2.81,)
loader_version_range=[4,)

## Mod Properties
mod_id=jadecolonies
mod_name=JadeColonies
mod_version=1.6.0
mod_license=GPLv3
mod_group_id=mirality
mod_authors=Mirality
mod_description=A Jade addon for MineColonies and/or Domum Ornamentum.
mod_issues=https://github.com/uecasm/jadecolonies/issues

# Required -- our locally ported 26.1.2 LDT stack (matches ../warehouseWorkshop's proven pattern).
# MineColonies itself is not published to mavenLocal by its own build, so it is consumed directly
# from its build/libs output (see build.gradle); the rest resolve from mavenLocal()/LDTTeam maven.
minecolonies_version=1.1.1397-26.1.2
structurize_version=0.0.1-26.1.2
multipiston_version=0.0.1-26.1.2
blockui_version=0.0.1-26.1.2
domumornamentum_version=1.0.0-local

# Jade 26.1.8+neoforge is the first Jade release targeting MC 26.1/26.1.1/26.1.2 (NeoForge).
# Resolved from Modrinth's Maven repo (see build.gradle) since no CurseMaven build exists yet
# for this MC version -- same coordinate already proven resolvable by ../MineColonies-Jade-crops.
jade_version=26.1.8+neoforge
